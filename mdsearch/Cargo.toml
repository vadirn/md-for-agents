[package]
name = "mdsearch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BM25 search over the Markdown files in one or more folders: an in-RAM inverted index, bilingual stemming, and gitignore-style exclusion files."

[[bin]]
name = "mdsearch"
path = "src/main.rs"

[dependencies]
cli.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
ignore = "0.4"
# The Snowball stemmers for English and Russian. The index itself is ours.
rust-stemmers = "1.2"

[dev-dependencies]
tempfile = "3"
