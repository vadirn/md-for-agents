# Shared dependencies are declared here and inherited with `.workspace = true`,
# so two members cannot drift onto different versions of the same crate.
[workspace]
resolver = "3"
members = ["cli", "mdstruct", "mdstruct-wasm", "mdread", "mdformat", "mdsearch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vadirn/md-for-agents"

[workspace.dependencies]
cli = { path = "cli" }
# Members use the parser, not mdstruct's own CLI, so they leave its `cli` feature off.
mdstruct = { path = "mdstruct", default-features = false }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# comrak's defaults add syntax highlighting, which compiles oniguruma's C, and
# comrak's own CLI. No member uses either.
comrak = { version = "0.53", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# The default `cjk` feature adds only `width_cjk`, which mdformat never calls.
unicode-width = { version = "0.2", default-features = false }

# The WebAssembly build trades speed for size, since a host downloads the module:
# cargo build --profile wasm --target wasm32-unknown-unknown -p mdstruct-wasm
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
