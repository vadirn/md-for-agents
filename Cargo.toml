# Shared dependencies are declared here and inherited with `.workspace = true`,
# so two members cannot drift onto different versions of the same crate.
[workspace]
resolver = "3"
members = ["mdstruct", "mdread", "mdformat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vadirn/md-for-agents"

[workspace.dependencies]
mdstruct = { path = "mdstruct" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "0.53"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-width = "0.2"
